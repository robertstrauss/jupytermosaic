[build-system]
requires = ["hatchling>=1.5.0", "jupyterlab>=4.0.0,<5", "hatch-nodejs-version>=0.3.2"]
build-backend = "hatchling.build"

[project]
name = "jupyter-mosaic"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
classifiers = [
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
]
dynamic = ["version", "description", "authors", "urls", "keywords"]

[tool.hatch.version]
source = "nodejs"

[tool.hatch.metadata.hooks.nodejs]
fields = ["description", "authors", "urls", "keywords"]

[tool.hatch.build.targets.sdist]
artifacts = ["mosaic/labextension"]
# Screenshots and demo notebooks are for the repository, not the package: they
# were 12 of a 14 MB sdist. The README's images point at GitHub directly.
exclude = [
    ".github",
    "binder",
    "gallery",
    "screenshots",
    "*.ipynb",
    ".ipynb_checkpoints",
    "test-results",
    "ui-tests",
    "coverage",
    "dockpanel",
    "LEGACY_MOSAIC_NOTEBOOK",
    "junit.xml",
]

# The distribution is `jupyter-mosaic` but the import package is still
# `mosaic`. Hatch infers the package from the distribution name, so after the
# rename it found nothing and built a wheel with no code in it.
[tool.hatch.build.targets.wheel]
packages = ["mosaic"]

[tool.hatch.build.targets.wheel.shared-data]
"mosaic/labextension" = "share/jupyter/labextensions/mosaic"
"install.json" = "share/jupyter/labextensions/mosaic/install.json"

[tool.hatch.build.hooks.version]
path = "mosaic/_version.py"

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.5"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "mosaic/labextension/static/style.js",
    "mosaic/labextension/package.json",
]
skip-if-exists = ["mosaic/labextension/static/style.js"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["jlpm"]

[tool.hatch.build.hooks.jupyter-builder.editable-build-kwargs]
build_cmd = "install:extension"
npm = ["jlpm"]
source_dir = "src"
build_dir = "mosaic/labextension"

[tool.jupyter-releaser.options]
version_cmd = "hatch version"

[tool.jupyter-releaser.hooks]
before-build-npm = [
    "python -m pip install 'jupyterlab>=4.0.0,<5'",
    "jlpm",
    "jlpm build:prod"
]
before-build-python = ["jlpm clean:all"]

[tool.check-wheel-contents]
ignore = ["W002"]
